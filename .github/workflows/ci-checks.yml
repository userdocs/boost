name: ci - checks
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci-checks:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run CI checks
        uses: userdocs/actions/checks@main # main
